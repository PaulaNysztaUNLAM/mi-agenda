<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi agenda</title>
<meta name="theme-color" content="#AFC4DA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi agenda">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Caveat:wght@600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#dfe4ea; --page-ink:#39424d; --app-bg:#AFC4DA;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#14171b; --page-ink:#c9ced5; color-scheme:dark; }
}
:root[data-theme="dark"]{ --page:#14171b; --page-ink:#c9ced5; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--page)}
body{margin:0;height:100%;background:var(--page);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block;flex-shrink:0}

/* ---------- Pieles ---------- */
[data-skin="celeste"]{--bg:#AFC4DA;--surface:#F2F5F9;--surface-2:#DCE5EF;--ink:#1D3352;--ink-soft:#5F7795;--ink-faint:#A9B8CA;--accent:#1D3352;--accent-ink:#F2F5F9;--soft:#8EA9C6;--soft-ink:#F6F9FC;--line:#CBD6E3}
[data-skin="rosa"]{--bg:#F7E1E7;--surface:#FFF8FA;--surface-2:#FBEAEF;--ink:#7E3F55;--ink-soft:#AC7487;--ink-faint:#E1C2CC;--accent:#B76A83;--accent-ink:#FFFFFF;--soft:#E8B9C7;--soft-ink:#FFFFFF;--line:#F1D6DE}
[data-skin="crema"]{--bg:#D9C9B2;--surface:#F6F0E6;--surface-2:#EADFCD;--ink:#47382B;--ink-soft:#86715D;--ink-faint:#C5B49D;--accent:#5A4636;--accent-ink:#F6F0E6;--soft:#7B7E61;--soft-ink:#F4F0E4;--line:#DFD2BE}
[data-skin]{--urgent:#D9434A;--urgent-ink:#FFFFFF}

/* ---------- Escenario y marco ---------- */
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px;gap:14px}
.phone{position:relative;width:390px;height:844px;border-radius:54px;border:11px solid #17191c;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);overflow:hidden;background:#17191c}
.caption{color:var(--page-ink);font-size:13px;margin:0;text-align:center;max-width:390px;line-height:1.5}
@media (max-width:520px){
  html,body{background:var(--app-bg)}
  .stage{padding:0;min-height:0;height:100%}
  .phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
  .caption,.statusbar{display:none !important}
}

/* ---------- App ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);transition:background .3s}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 30px 0;font-weight:800;font-size:15px;height:44px}
.statusbar .notch{width:110px;height:30px;border-radius:20px;background:#17191c;position:absolute;left:50%;top:9px;transform:translateX(-50%)}
.statusbar .sig{display:flex;gap:5px;align-items:center}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;gap:10px}
.topbar h1{font-size:17px;font-weight:800;margin:0;flex:1;text-align:center}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center}
.todaybtn{height:42px;padding:0 16px;border-radius:21px;border:0;background:var(--surface);font-weight:800;font-size:14px}
.todaybtn[hidden]{display:block;visibility:hidden}
.scroll{flex:1;overflow-y:auto;padding:4px 14px 36px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll[hidden]{display:none}
.block{background:var(--surface);border-radius:32px;padding:16px;position:relative}

/* Calendario */
.cal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.monthpill{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:20px;padding:8px 14px;font-weight:800;font-size:15px}
.chevs{display:flex;gap:6px}
.chev{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);justify-items:center}
.wk{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:8px}
.grid{row-gap:14px}
.day{position:relative;width:38px;height:38px;border-radius:50%;border:0;background:var(--surface-2);color:var(--ink);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.day.out{background:transparent;color:var(--ink-faint);font-weight:700}
.day.today{box-shadow:inset 0 0 0 2px var(--ink);background:var(--surface)}
.day.sel{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.badges{position:absolute;top:-7px;right:-8px;display:flex;pointer-events:none}
.badges.multi{right:auto;left:50%;transform:translateX(-50%);top:-11px}
.badge{width:21px;height:21px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.badges.multi .badge{width:18px;height:18px;margin-left:-3px;box-shadow:0 0 0 1.5px var(--surface)}
.badges.multi .badge:first-child{margin-left:0}
.day.out .badges{opacity:.55}
.badges.more::after{content:"";position:absolute;top:-1px;right:-3px;width:6px;height:6px;border-radius:50%;background:var(--accent);border:1.5px solid var(--surface)}
.day.tinted.out{opacity:.5}
.day.tinted.sel{box-shadow:0 0 0 2.5px var(--surface),0 0 0 4.5px var(--accent)}
.day.tinted.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.tinted.today.sel{box-shadow:inset 0 0 0 2px var(--ink),0 0 0 2.5px var(--surface),0 0 0 4.5px var(--accent)}
.typerow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.typerow .ic{width:46px;height:46px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;flex-shrink:0;color:var(--ink)}
.typerow .ic[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.typerow .lbl{flex:1;font-weight:800}
.typerow input{flex:1;min-width:0}
.typerow .x{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink-soft);display:grid;place-items:center;flex-shrink:0}
.cdot{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex-shrink:0;color:var(--ink-faint);padding:0}
.cdot[aria-expanded="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:6px 2px 14px;justify-items:center}
.cgrid button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;padding:0;color:var(--ink-faint);background:var(--surface)}
.cgrid button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}

/* Urgentes y emojis */
.day.urgent{background:var(--urgent);color:var(--urgent-ink)}
.day.urgent.today{box-shadow:inset 0 0 0 2px var(--urgent-ink),0 0 0 2px var(--urgent)}
.day.urgent.sel{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 2.5px var(--surface),0 0 0 4.5px var(--urgent)}
.todo .emo{display:inline-flex;vertical-align:-3px;margin-right:7px;color:var(--ink)}
.todo.done .emo{color:var(--ink-soft)}
.todo.urgent .txt{color:var(--urgent)}
.todo.urgent.done .txt{color:var(--ink-soft)}
.flag{border:0;background:transparent;color:var(--ink-faint);width:30px;height:30px;display:grid;place-items:center;border-radius:50%;padding:0}
.flag.on{color:var(--urgent)}
.addrow .addflag{background:var(--surface-2);color:var(--ink-soft)}
.addrow .addflag.on{background:var(--urgent);color:var(--urgent-ink)}
.addhint{font-size:12px;color:var(--ink-soft);margin:8px 6px 0;line-height:1.45}
.magic{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.magic .ic{width:46px;height:46px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;flex-shrink:0;color:var(--ink)}
.magic .ic[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.magic input{flex:1;min-width:0}
.magic .x{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink-soft);display:grid;place-items:center;flex-shrink:0}
.addmagic{width:100%;height:46px;border-radius:23px;border:1.5px dashed var(--ink-faint);background:transparent;font-weight:800;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}

/* Día */
.block.events{padding-bottom:78px}
.dayhead{display:flex;align-items:center;gap:14px;border-left:3px solid var(--ink);padding-left:12px;margin:4px 0 14px}
.dayhead .num{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:800;font-size:60px;line-height:.85;letter-spacing:-.5px}
.dayhead .wd{font-weight:800;font-size:16px;text-transform:capitalize}
.dayhead .count{font-size:13px;color:var(--ink-soft);margin-top:2px}
.evlist{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:20px;padding:10px 10px 10px 10px;border:0;width:100%;text-align:left}
.ev .ic{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex-shrink:0}
.ev .body{flex:1;min-width:0}
.ev .time{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-weight:700}
.ev .name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .del{width:36px;height:36px;border-radius:13px;border:1.5px solid var(--ink-soft);background:transparent;display:grid;place-items:center;flex-shrink:0;color:var(--ink-soft)}
.empty{color:var(--ink-soft);font-size:14px;line-height:1.5;padding:6px 2px}
.fab{position:absolute;right:16px;bottom:16px;width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 18px -8px var(--accent)}

/* Pendientes */
.todohead{display:flex;justify-content:space-between;align-items:baseline;margin:2px 4px 6px}
.todohead h2{font-size:17px;margin:0;font-weight:800}
.todohead span{font-size:13px;color:var(--ink-soft);font-weight:700}
.todo{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1.5px dashed var(--line)}
.todo:last-child{border-bottom:0}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink-soft);background:transparent;display:grid;place-items:center;flex-shrink:0;padding:0;color:var(--accent-ink)}
.todo.done .chk{background:var(--accent);border-color:var(--accent)}
.todo .txt{flex:1;font-size:15px;font-weight:700;line-height:1.35}
.todo.done .txt{text-decoration:line-through;color:var(--ink-soft);font-weight:500}
.todo .auto{display:inline-flex;vertical-align:-3px;margin-right:6px;color:var(--ink-soft)}
.todo .x{border:0;background:transparent;color:var(--ink-faint);width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0}
.addrow button{width:46px;height:46px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center}

input[type=text],input[type=date],input[type=time]{width:100%;border:0;background:var(--surface-2);color:var(--ink);border-radius:16px;padding:13px 14px;font:inherit;font-weight:700;font-size:15px;min-height:46px;color-scheme:light}
input::placeholder{color:var(--ink-soft);font-weight:500;opacity:.8}

/* Cajón lateral */
.overlay{position:absolute;inset:0;background:rgba(10,12,16,.38);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.overlay.on{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;bottom:0;left:0;width:78%;max-width:300px;background:var(--surface);border-radius:0 34px 34px 0;transform:translateX(-102%);transition:transform .28s cubic-bezier(.3,.7,.2,1);z-index:21;padding:70px 16px 24px;display:flex;flex-direction:column;gap:6px}
.drawer.on{transform:none}
.drawer .brand{font-family:"Caveat",cursive;font-size:36px;padding:0 12px 18px}
.navitem{display:flex;align-items:center;gap:14px;border:0;background:transparent;padding:14px 14px;border-radius:20px;font-weight:800;font-size:16px;text-align:left}
.navitem.on{background:var(--surface-2)}

/* Hoja inferior */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:34px 34px 0 0;transform:translateY(102%);transition:transform .3s cubic-bezier(.3,.7,.2,1);z-index:22;max-height:90%;overflow-y:auto;padding:10px 18px 26px}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:20px;font-weight:800}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.chip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:18px;border:0;background:var(--surface-2);font-weight:800;font-size:13px;min-height:68px;justify-content:center}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;font-weight:800;color:var(--ink-soft);margin:0 0 6px 4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-weight:800;border:0;width:100%}
.sw-track{width:44px;height:26px;border-radius:13px;background:var(--ink-faint);position:relative;transition:background .2s}
.sw-track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-checked="true"] .sw-track{background:var(--accent)}
.toggle[aria-checked="true"] .sw-track::after{transform:translateX(18px)}
.hint{font-size:13px;color:var(--ink-soft);background:var(--surface-2);border-radius:16px;padding:10px 14px;margin:0 0 12px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.timebtn{width:100%;min-height:46px;border:0;background:var(--surface-2);color:var(--ink);border-radius:16px;padding:12px 14px;font-weight:800;font-size:15px;text-align:left;font-variant-numeric:tabular-nums}
.timebtn.on{box-shadow:inset 0 0 0 2px var(--accent)}
.tpanel{background:var(--surface-2);border-radius:20px;padding:12px;margin:0 0 12px}
.tlabel{font-size:12px;font-weight:800;color:var(--ink-soft);margin:2px 2px 6px}
.tgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tgrid button,.ampm button{height:42px;border-radius:12px;border:0;background:var(--surface);color:var(--ink);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.tgrid button.on,.ampm button.on{background:var(--accent);color:var(--accent-ink)}
.ampm{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 12px}
.tpanel .done{width:100%;height:42px;border-radius:21px;border:0;background:var(--surface);font-weight:800;margin-top:12px;color:var(--ink)}
.err{color:#b3261e;font-size:13px;font-weight:800;margin:-4px 4px 10px;min-height:0}
.actions{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;height:52px;border-radius:26px;border:0;font-weight:800;font-size:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2)}
.btn.danger{background:transparent;border:1.5px solid var(--ink-soft);color:var(--ink-soft);flex:0 0 auto;padding:0 18px}

/* Configuración */
.set h2{font-size:17px;margin:0 0 4px;font-weight:800}
.set p.sub{margin:0 0 14px;font-size:13px;color:var(--ink-soft);line-height:1.45}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.swatch{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--ink)}
.swatch .pv{width:100%;aspect-ratio:3/4;border-radius:22px;background:var(--bg);padding:10px 8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 0 0 2px transparent;transition:box-shadow .2s}
.swatch.on .pv{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.pv .c{background:var(--surface);border-radius:12px;padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;justify-items:center}
.pv .c i{width:12px;height:12px;border-radius:50%;background:var(--surface-2)}
.pv .c i.a{background:var(--accent)}
.pv .s{height:14px;border-radius:7px;background:var(--soft)}
.pv .b{flex:1;border-radius:12px;background:var(--surface)}
.icrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--surface-2);border-radius:20px;padding:10px 14px 10px 10px;margin-bottom:8px;text-align:left}
.icrow .ic{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.icrow .lbl{flex:1;font-weight:800}
.icrow .cur{font-size:13px;color:var(--ink-soft);font-weight:700}
.icgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:6px 2px 14px}
.icopt{aspect-ratio:1;border-radius:16px;border:0;background:var(--surface-2);display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--ink-soft)}
.icopt.on{background:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:46px;height:46px;border-radius:50%;border:0;background:var(--surface-2);font-size:22px;font-weight:800}
.stepper output{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-size:44px;font-weight:800;min-width:56px;text-align:center;line-height:1}
.stepper small{color:var(--ink-soft);font-weight:700;font-size:14px}

.toast{position:absolute;left:16px;right:16px;bottom:22px;background:var(--ink);color:var(--surface);border-radius:20px;padding:13px 16px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;transform:translateY(140%);opacity:0;transition:transform .25s,opacity .25s;z-index:30}
.toast.on{transform:none;opacity:1}
.toast button{border:0;background:transparent;color:var(--surface);font-weight:800;text-decoration:underline;padding:4px}

:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.day.sel:focus-visible{outline-color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="app" id="app" data-skin="celeste">
      <div class="statusbar"><span id="clock">9:41</span><span class="notch"></span><span class="sig">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="2.5" y="2.5" width="16" height="8" rx="2" fill="currentColor"/><rect x="24" y="4.5" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".5"/></svg>
      </span></div>

      <header class="topbar">
        <button class="iconbtn" data-act="menu" aria-label="Abrir menú"></button>
        <h1 id="title">Calendario</h1>
        <button class="todaybtn" data-act="today" id="todayBtn">Hoy</button>
      </header>

      <main class="scroll" id="view-cal">
        <section class="block" id="calBlock">
          <div class="cal-top">
            <div class="monthpill"><span id="pillIcon"></span><span id="monthLabel"></span></div>
            <div class="chevs">
              <button class="chev" data-act="prev" aria-label="Mes anterior"></button>

  menu:'<path d="M4 7h16M4 12h10M4 17h16"/>',

  trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/>',

  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',

};
function ico(n, s=20, w=2){
  if(!n || n==='none') return '';
  return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
}
const ICON_CHOICES = ['plane','suitcase','pin','exam','clipboard','cap','pencil','book','notebook','laptop','folder','code','flask','wallet','cart','star','heart','cake','gift','medical','users','briefcase','ball','bell','coffee','dumbbell','music','dot','none'];
const ICON_NAMES = {plane:'Avión',suitcase:'Valija',pin:'Ubicación',exam:'Hoja de examen',clipboard:'Planilla',cap:'Birrete',pencil:'Lápiz',book:'Libro',notebook:'Cuaderno',wallet:'Billetera',cart:'Carrito',laptop:'Notebook',folder:'Carpeta',code:'Código',flask:'Laboratorio',star:'Estrella',heart:'Corazón',cake:'Torta',gift:'Regalo',medical:'Salud',users:'Personas',briefcase:'Trabajo',ball:'Deporte',bell:'Campana',coffee:'Café',dumbbell:'Pesas',music:'Música',dot:'Punto',none:'Sin ícono'};
const BASE_TYPES = {
  evento:{label:'Evento', field:'Título', ph:'Ej: Turno con el dentista'},
  examen:{label:'Examen', field:'Materia', ph:'Ej: Química General'},
  tp:{label:'TP', field:'Materia', ph:'Ej: Programación II'},
  viaje:{label:'Viaje', field:'Destino', ph:'Ej: Mar del Plata'}
};
/* los tipos creados por el usuario se resuelven desde el estado */
const TYPES = new Proxy(BASE_TYPES, {get(t, k){
  if(k in t) return t[k];
  const c = (state.customTypes || []).find(x => x.id === k);
  const label = (c && c.label.trim()) || 'Evento';
  return {label, field:'Título', ph:'Ej: Título del evento'};
}});
const customIds = () => (state.customTypes || []).map(c => c.id);
const typeOrder = () => ['examen','tp','viaje','evento', ...customIds()];   // mismo orden que en Configuración
const SKINS = {rosa:'Rosa', celeste:'Celeste', crema:'Crema'};
const SKIN_BG = {rosa:'#F7E1E7', celeste:'#AFC4DA', crema:'#D9C9B2'};
const MAGIC_ICONS = ICON_CHOICES.filter(n => n !== 'none');
const DAY_COLORS = ['#C9B6E4','#A8DCC6','#F7C59F','#F5DD8C','#9CC8EC','#F4AFC6','#B5C99A','#7E6BB0','#3F6FB5','#3E8E6A','#E07B39','#9AA3AD'];
const COLOR_NAMES = {'#C9B6E4':'Lila','#A8DCC6':'Menta','#F7C59F':'Durazno','#F5DD8C':'Amarillo','#9CC8EC':'Celeste','#F4AFC6':'Rosa','#B5C99A':'Salvia','#7E6BB0':'Violeta','#3F6FB5':'Azul','#3E8E6A':'Verde','#E07B39':'Naranja','#9AA3AD':'Gris'};
function inkFor(hex){
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.6 ? '#2A2630' : '#FFFFFF';
}

/* ---------- Fechas ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const todayIso = () => iso(new Date());
const fmtMonth = new Intl.DateTimeFormat('es-AR',{month:'long'});
const fmtWd = new Intl.DateTimeFormat('es-AR',{weekday:'long'});
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const shortDate = s => { const d = parse(s); return `${d.getDate()}/${d.getMonth()+1}`; };
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Estado ---------- */
const KEY = 'mi-agenda-v1';
function seed(){
  const t = todayIso();
  return {
    skin:'celeste',
    icons:{viaje:'plane', examen:'exam', tp:'laptop', evento:'dot', c_cumple:'cake'},
    colors:{examen:'#C9B6E4', tp:'#A8DCC6'},
    customTypes:[{id:'c_cumple', label:'Cumpleaños'}],
    studyDays:15,
    magic:[
      {id:'m1', words:'estudiar, estudio, repasar', icon:'notebook'},
      {id:'m2', words:'tp, trabajo práctico', icon:'laptop'},
      {id:'m3', words:'pagar, factura', icon:'wallet'},
      {id:'m4', words:'comprar', icon:'cart'}
    ],
    urgentWords:'pagar, factura, vence, urgente',
    events:[
      {id:uid(), type:'evento', title:'Caminata', date:t, start:'07:00', end:'07:45'},
      {id:uid(), type:'evento', title:'Clase de inglés', date:t, start:'18:30', end:'20:00'},
      {id:uid(), type:'tp', title:'Sistemas Operativos', date:addDays(t,6), start:'23:00', end:'23:59'},
      {id:uid(), type:'examen', title:'Física I', date:addDays(t,9), start:'14:00', end:'16:00'},
      {id:uid(), type:'examen', title:'Análisis Matemático', date:addDays(t,15), start:'09:00', end:'12:00'},
      {id:uid(), type:'viaje', title:'Córdoba', date:addDays(t,19), endDate:addDays(t,21), allDay:true},
      {id:uid(), type:'c_cumple', title:'Cumple de Sofi', date:addDays(t,12), allDay:true}
    ],
    todos:{
      [t]:[{id:uid(), text:'Pagar factura de luz', done:false, urgent:true},{id:uid(), text:'Comprar apuntes', done:false},{id:uid(), text:'Pagar la cuota del gimnasio', done:true, urgent:true}],
      [addDays(t,1)]:[{id:uid(), text:'Avanzar TP de Sistemas Operativos', done:false}],
      [addDays(t,2)]:[{id:uid(), text:'Estudiar vocabulario de inglés', done:false}]
    },
    autoDone:{}
  };
}
function emptyState(){ const s = seed(); s.events = []; s.todos = {}; s.autoDone = {}; return s; }
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const o = JSON.parse(raw); const s = seed(); return Object.assign(s, o, {icons:Object.assign(s.icons, o.icons||{}), colors:Object.assign(s.colors, o.colors||{})}); }
  }catch(e){}
  return emptyState();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

let state = load();
let sel = todayIso();
let view = {y:new Date().getFullYear(), m:new Date().getMonth()};
let route = 'cal';
let form = null;          // estado de la hoja de evento
let openIcon = null;      // tipo cuyo selector de ícono está abierto
let openColor = null;     // tipo cuyo selector de color está abierto
let openMagic = null, addUrgent = false;
let undoFn = null, toastT = null, resetArmed = false;

const $ = id => document.getElementById(id);

/* ---------- Datos derivados ---------- */
function eventsOn(s){
  return state.events.filter(e => s >= e.date && s <= (e.endDate || e.date))
    .sort((a,b) => (b.allDay?1:0)-(a.allDay?1:0) || startOn(a,s).localeCompare(startOn(b,s)));
}
function startOn(e, s){ return !e.allDay && e.date < s ? '00:00' : (e.start || ''); }
function crossesMidnight(e){ return !e.allDay && e.type !== 'viaje' && e.endDate && e.endDate > e.date;
}
function autoTodos(s){
  return state.events.filter(e => e.type === 'examen')
    .map(e => ({e, n:diffDays(s, e.date)}))
    .filter(x => x.n >= 1 && x.n <= state.studyDays)
    .sort((a,b) => a.n - b.n)
    .map(x => { const key = x.e.id+'|'+s; return {key, text:`Estudiar ${x.e.title} (${x.n})`, done:!!state.autoDone[key], auto:true}; });
}
function todosOn(s){ return [...autoTodos(s), ...(state.todos[s]||[])]; }
function dayUrgent(s){ return (state.todos[s]||[]).some(t => t.urgent && !t.done); }
function wordRe(w){
  const e = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp('(^|[^\\p{L}\\p{N}])' + e + '($|[^\\p{L}\\p{N}])', 'iu');
}
function markerFor(text){
  for(const r of state.magic || []){
    const words = r.words.split(',').map(w => w.trim()).filter(Boolean);
    if(words.some(w => wordRe(w).test(text))) return r.icon;
  }
  return '';
}
function isUrgentText(text){
  const t = text.toLowerCase();
  return (state.urgentWords||'').split(',').map(w => w.trim().toLowerCase()).filter(Boolean).some(w => t.includes(w));
}

/* ---------- Render ---------- */
function applySkin(){
  $('app').dataset.skin = state.skin;
  document.documentElement.style.setProperty('--app-bg', SKIN_BG[state.skin]);
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = SKIN_BG[state.skin];
}

function renderCalendar(){
  const {y,m} = view;
  $('monthLabel').textContent = `${cap(fmtMonth.format(new Date(y,m,1)))} ${y}`;
  const offset = (new Date(y,m,1).getDay()+6)%7;
  const dim = new Date(y,m+1,0).getDate();
  const cells = Math.ceil((offset+dim)/7)*7;
  const t = todayIso();
  const order = typeOrder();
  let html = '';
  for(let i=0;i<cells;i++){
    const d = new Date(y,m,1-offset+i);
    const s = iso(d);
    const out = d.getMonth() !== m;
    const evs = eventsOn(s);
    const withIcon = evs.filter(e => state.icons[e.type] && state.icons[e.type] !== 'none')
      .sort((a,b) => order.indexOf(a.type) - order.indexOf(b.type));
    const shown = withIcon.slice(0, 3), multi = shown.length > 1;
    const badge = shown.length ? `<span class="badges${multi?' multi':''}${withIcon.length>3?' more':''}">${shown.map(e => `<span class="badge">${ico(state.icons[e.type], multi?11:13, 2.2)}</span>`).join('')}</span>` : '';
    const urgent = dayUrgent(s);
    const tintType = urgent ? null : order.find(tp => state.colors && state.colors[tp] && evs.some(e => e.type === tp));
    const tint = tintType ? state.colors[tintType] : '';
    const style = tint ? ` style="background:${tint};color:${inkFor(tint)}"` : '';
    const cls = ['day', out&&'out', s===t&&'today', s===sel&&'sel', urgent&&'urgent', tint&&'tinted'].filter(Boolean).join(' ');
    const label = `${d.getDate()} de ${fmtMonth.format(d)}${evs.length?`, ${evs.length} evento${evs.length>1?'s':''}`:''}`;
    html += `<button class="${cls}" data-act="day" data-date="${s}" aria-label="${label}"${style} ${s===sel?'aria-current="date"':''}>${d.getDate()}${badge}</button>`;
  }
  $('grid').innerHTML = html;
}


function renderDay(){
  const d = parse(sel);
  const evs = eventsOn(sel);
  const pend = todosOn(sel).filter(x => !x.done).length;
  const urg = (state.todos[sel]||[]).filter(t => t.urgent && !t.done).length;
  const wd = sel === todayIso() ? 'Hoy, '+fmtWd.format(d) : fmtWd.format(d);
  $('dayhead').innerHTML = `<div class="num">${pad(d.getDate())}</div><div><div class="wd">${wd}</div><div class="count">${evs.length} evento${evs.length===1?'':'s'} y ${pend} tarea${pend===1?'':'s'} pendiente${pend===1?'':'s'}</div>${urg ? `<div class="count" style="color:var(--urgent);font-weight:800">${urg} urgente${urg===1?'':'s'} sin completar</div>` : ''}</div>`;
  $('evlist').innerHTML = evs.length ? evs.map(e => {
    let time;
    if(e.allDay){
      time = e.endDate && e.endDate !== e.date ? `Todo el día, del ${shortDate(e.date)} al ${shortDate(e.endDate)}` : 'Todo el día';
    } else {
      if(crossesMidnight(e) && sel > e.date) time = `Empezó ayer a las ${fmtT(e.start)}, termina ${fmtT(e.end)}`;
      else if(crossesMidnight(e)) time = `${fmtT(e.start)} – ${fmtT(e.end)} del día siguiente`;
      else time = e.end ? `${fmtT(e.start)} – ${fmtT(e.end)}` : fmtT(e.start);
    }
    const pre = e.type === 'examen' ? 'Examen: ' : e.type === 'tp' ? 'Entrega TP: ' : e.type === 'viaje' ? 'Viaje a ' : '';
    return `<div class="ev" role="button" tabindex="0" data-act="edit" data-id="${e.id}">
      <span class="ic">${ico(state.icons[e.type] === 'none' ? 'dot' : state.icons[e.type],18)}</span>
      <span class="body"><div class="time">${time}</div><div class="name">${esc(pre+e.title)}</div></span>

}

function renderNav(){
  document.querySelectorAll('.navitem').forEach(b => {
    const r = b.dataset.route;
    b.classList.toggle('on', r === route);
    b.innerHTML = r === 'cal' ? `${ico('cal',22)} Calendario` : `${ico('gear',22)} Configuración`;
  });
  $('view-cal').hidden = route !== 'cal';
  $('view-set').hidden = route !== 'set';
  $('title').textContent = route === 'cal' ? 'Calendario' : 'Configuración';
  $('todayBtn').hidden = route !== 'cal';
}

function renderAll(){
  applySkin(); renderCalendar(); renderDay(); renderTodos(); renderNav();
  if(route === 'set') renderSettings();
}

/* ---------- Hoja de evento ---------- */
function openSheet(ev){
  form = ev ? {...ev, allDay:!!ev.allDay} : {id:null, type:'evento', title:'', date:sel, endDate:'', start:'09:00', end:'10:00', allDay:false};
  drawSheet(); $('sheet').classList.add('on'); $('overlay').classList.add('on');
  setTimeout(() => { const i = $('fTitle'); if(i && !ev) i.focus(); }, 320);
}
function drawSheet(err=''){
  const f = form, T = TYPES[f.type];
  const n = state.studyDays;
  $('sheet').innerHTML = `
    <div class="grab"></div>
    <h3 id="sheetTitle">${f.id ? 'Editar' : 'Nuevo'} ${T.label.toLowerCase()}</h3>
    <div class="types" role="radiogroup" aria-label="Tipo">
      ${['evento','examen','tp','viaje', ...customIds()].map(tp => `<button class="chip${f.type===tp?' on':''}" role="radio" aria-checked="${f.type===tp}" data-act="ftype" data-val="${tp}">${ico(state.icons[tp]==='none'?'dot':state.icons[tp],20)}${TYPES[tp].label}</button>`).join('')}
    </div>
    <label class="field"><span>${T.field}</span><input type="text" id="fTitle" value="${esc(f.title)}" placeholder="${T.ph}" maxlength="40"></label>
    <div class="${f.type==='viaje'?'row2':''}">
      <label class="field"><span>${f.type==='viaje'?'Desde':'Fecha'}</span><input type="date" id="fDate" value="${f.date}"></label>
      ${f.type==='viaje' ? `<label class="field"><span>Hasta</span><input type="date" id="fEndDate" value="${f.endDate||f.date}"></label>` : ''}
    </div>
    <button class="toggle" role="switch" aria-checked="${f.allDay}" data-act="fallday">Todo el día <span class="sw-track"></span></button>
    ${f.allDay ? '' : `<div class="row2">
      <div class="field"><span>Empieza</span><button class="timebtn${f.pick==='start'?' on':''}" data-act="tpick" data-val="start" aria-expanded="${f.pick==='start'}">${f.start ? fmtT(f.start) : 'Elegir hora'}</button></div>
      <div class="field"><span>Termina</span><button class="timebtn${f.pick==='end'?' on':''}" data-act="tpick" data-val="end" aria-expanded="${f.pick==='end'}">${f.end ? fmtT(f.end) + (f.start && f.end < f.start ? ' (día siguiente)' : '') : 'Elegir hora'}</button></div>
    </div>
    ${f.pick ? timePanel(f[f.pick] || '09:00') : ''}`}
    ${f.type==='examen' ? `<p class="hint">${ico('info',18)}<span>Se va a agregar “Estudiar ${esc(f.title||'materia')} (N)” en Pendientes durante los ${n} días anteriores al examen.</span></p>` : ''}
    ${err ? `<p class="err" role="alert">${err}</p>` : ''}
    <div class="actions">
      ${f.id ? `<button class="btn danger" data-act="fdelete" aria-label="Eliminar">${ico('trash',18)}</button>` : ''}
      <button class="btn ghost" data-act="close-all">Cancelar</button>
      <button class="btn primary" data-act="fsave">Guardar</button>
    </div>`;
}
/* ---------- Selector de hora: AM = 00–11, PM = 12–23 ---------- */
function splitT(hm){ const [h, m] = hm.split(':').map(Number); return {h, m}; }
function fmtT(hm){ return hm || ''; }
function plusHour(hm){ const {h, m} = splitT(hm); const t = (h*60 + m + 60) % (24*60); return pad(Math.floor(t/60)) + ':' + pad(t % 60); }
function timePanel(hm){
  const t = splitT(hm), pm = t.h >= 12, base = pm ? 12 : 0;
  const hours = Array.from({length:12}, (_, i) => base + i).map(h => `<button class="${t.h===h?'on':''}" data-act="th" data-val="${h}">${pad(h)}</button>`).join('');
  const mins = [0,5,10,15,20,25,30,35,40,45,50,55].map(m => `<button class="${t.m===m?'on':''}" data-act="tm" data-val="${m}">:${pad(m)}</button>`).join('');
  return `<div class="tpanel">
    <div class="tlabel">Hora</div><div class="tgrid">${hours}</div>
    <div class="ampm"><button class="${!pm?'on':''}" data-act="tap" data-val="am">AM</button><button class="${pm?'on':''}" data-act="tap" data-val="pm">PM</button></div>
    <div class="tlabel">Minutos</div><div class="tgrid">${mins}</div>
    <button class="done" data-act="tpick" data-val="">Listo</button>
  </div>`;
}
function setPickTime(change){
  readForm();
  const field = form.pick; if(!field) return;
  const t = splitT(form[field] || '09:00');
  if('h' in change) t.h = change.h;
  if('m' in change) t.m = change.m;
  if('pm' in change) t.h = (t.h % 12) + (change.pm ? 12 : 0);
  form[field] = pad(t.h) + ':' + pad(t.m);
  if(field === 'start') form.end = plusHour(form.start);   // termina 1 hora después
  drawSheet();
}
function readForm(){
  const v = id => { const el = $(id); return el ? el.value : undefined; };
  if(v('fTitle') !== undefined) form.title = v('fTitle');
  if(v('fDate')) form.date = v('fDate');
  if(v('fEndDate') !== undefined) form.endDate = v('fEndDate');
  if(v('fStart') !== undefined) form.start = v('fStart');
  if(v('fEnd') !== undefined) form.end = v('fEnd');
}
function saveForm(){
  readForm();
  const f = form;
  f.title = f.title.trim();
  if(!f.title) return drawSheet(`Escribí ${TYPES[f.type].field === 'Destino' ? 'el destino' : TYPES[f.type].field === 'Materia' ? 'la materia' : 'un título'}.`);
  if(!f.date) return drawSheet('Elegí una fecha.');
  if(f.type === 'viaje'){ if(!f.endDate) f.endDate = f.date; if(f.endDate < f.date) return drawSheet('La fecha de vuelta no puede ser antes que la de ida.'); }
  else delete f.endDate;
  if(f.type !== 'viaje' && !f.allDay && f.end && f.end < f.start) f.endDate = addDays(f.date, 1);   // pasa la medianoche
  if(!f.allDay){
    if(!f.start) return drawSheet('Indicá la hora de inicio o marcá “Todo el día”.');
    if(f.end && f.end === f.start) return drawSheet('La hora de fin tiene que ser distinta a la de inicio.');
  } else { delete f.start; delete f.end; }
  const isNew = !f.id;
  const ev = {...f, id:f.id || uid()};
  if(!ev.allDay) delete ev.allDay;
  if(isNew) state.events.push(ev); else state.events = state.events.map(e => e.id === ev.id ? ev : e);
  save();
  sel = ev.date; const d = parse(sel); view = {y:d.getFullYear(), m:d.getMonth()};
  closeAll(); renderAll();
  const label = TYPES[ev.type].label;
  toast(ev.type === 'examen' ? `Examen guardado. Tareas de estudio agregadas.` : `${label} guardado.`);
}

/* ---------- Utilidades UI ---------- */
function closeAll(){
  $('sheet').classList.remove('on'); $('drawer').classList.remove('on'); $('overlay').classList.remove('on'); form = null;
}
function toast(msg, undo){
  $('toastMsg').textContent = msg;
  undoFn = undo || null; $('toastUndo').hidden = !undo;
  $('toast').classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => { $('toast').classList.remove('on'); undoFn = null; }, undo ? 4500 : 2200);
}
function goMonth(delta){
  view.m += delta;
  if(view.m < 0){ view.m = 11; view.y--; } else if(view.m > 11){ view.m = 0; view.y++; }
  renderCalendar();
}
function addTodo(){
  const i = $('todoInput'); const t = i.value.trim(); if(!t) return;
  const urgent = addUrgent || isUrgentText(t);
  (state.todos[sel] = state.todos[sel] || []).push({id:uid(), text:t, done:false, urgent});
  i.value = ''; addUrgent = false; syncAddFlag(); save(); renderCalendar(); renderTodos(); renderDay();
  if(urgent) toast('Tarea urgente: el día queda en rojo hasta completarla.');
}
function syncAddFlag(){
  const on = addUrgent || isUrgentText($('todoInput').value);
  const b = $('addFlag'); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
}

/* ---------- Eventos ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  switch(a){
    case 'menu': $('drawer').classList.add('on'); $('overlay').classList.add('on'); break;
    case 'close-all': closeAll(); break;
    case 'nav': route = b.dataset.route; resetArmed = false; openIcon = null; closeAll(); renderAll(); $(route==='cal'?'view-cal':'view-set').scrollTop = 0; break;
    case 'prev': goMonth(-1); break;
    case 'next': goMonth(1); break;
    case 'today': { sel = todayIso(); const d = new Date(); view = {y:d.getFullYear(), m:d.getMonth()}; renderAll(); break; }
    case 'day': { sel = b.dataset.date; const d = parse(sel); if(d.getMonth() !== view.m){ view = {y:d.getFullYear(), m:d.getMonth()}; } renderCalendar(); renderDay(); renderTodos(); break; }
    case 'add': openSheet(null); break;
    case 'edit': openSheet(state.events.find(x => x.id === b.dataset.id)); break;
    case 'del': {
      e.stopPropagation();
      const ev = state.events.find(x => x.id === b.dataset.id); if(!ev) break;
      state.events = state.events.filter(x => x.id !== ev.id); save(); renderAll();
      toast(`${TYPES[ev.type].label} eliminado.`, () => { state.events.push(ev); save(); renderAll(); });
      break;
    }
    case 'undo': if(undoFn){ undoFn(); undoFn = null; } $('toast').classList.remove('on'); break;
    case 'todo-toggle': {
      if(b.dataset.key){ const k = b.dataset.key; if(state.autoDone[k]) delete state.autoDone[k]; else state.autoDone[k] = true; }
      else { const t = (state.todos[sel]||[]).find(x => x.id === b.dataset.id); if(t) t.done = !t.done; }
      save(); renderCalendar(); renderTodos(); renderDay(); break;
    }
    case 'todo-del': state.todos[sel] = (state.todos[sel]||[]).filter(x => x.id !== b.dataset.id); save(); renderCalendar(); renderTodos(); renderDay(); break;
    case 'todo-flag': { const t = (state.todos[sel]||[]).find(x => x.id === b.dataset.id); if(t) t.urgent = !t.urgent; save(); renderCalendar(); renderTodos(); renderDay(); break; }
    case 'add-flag': addUrgent = !addUrgent; syncAddFlag(); break;
    case 'ctype-add': {
      const id = 'c_' + uid();
      state.customTypes = state.customTypes || [];
      state.customTypes.push({id, label:''}); state.icons[id] = 'star'; openIcon = id;
      save(); renderSettings();
      const inp = document.querySelector(`[data-ctype="${id}"]`); if(inp) inp.focus();
      break;
    }
    case 'ctype-del': {
      const id = b.dataset.id;
      state.customTypes = state.customTypes.filter(c => c.id !== id);
      state.events.forEach(ev => { if(ev.type === id) ev.type = 'evento'; });
      delete state.icons[id]; if(state.colors) delete state.colors[id]; if(openIcon === id) openIcon = null; if(openColor === id) openColor = null;
      save(); renderAll(); toast('Tipo borrado. Sus eventos pasaron a “Evento”.');
      break;
    }
    case 'magic-open': openMagic = openMagic === b.dataset.id ? null : b.dataset.id; renderSettings(); break;
    case 'magic-pick': { const r = state.magic.find(x => x.id === b.dataset.id); if(r) r.icon = b.dataset.val; save(); renderSettings(); renderTodos(); break; }
    case 'magic-del': state.magic = state.magic.filter(x => x.id !== b.dataset.id); if(openMagic === b.dataset.id) openMagic = null; save(); renderSettings(); renderTodos(); break;
    case 'magic-add': { const r = {id:uid(), words:'', icon:'star'}; state.magic.push(r); openMagic = r.id; save(); renderSettings(); const inp = document.querySelector(`[data-magic="${r.id}"]`); if(inp) inp.focus(); break; }
    case 'todo-add': addTodo(); break;
    case 'skin': state.skin = b.dataset.val; save(); applySkin(); renderSettings(); break;
    case 'icon-open': openIcon = openIcon === b.dataset.type ? null : b.dataset.type; openColor = null; renderSettings(); break;
    case 'color-open': openColor = openColor === b.dataset.type ? null : b.dataset.type; openIcon = null; renderSettings(); break;
    case 'color-pick': state.colors = state.colors || {}; state.colors[b.dataset.type] = b.dataset.val; save(); renderSettings(); renderCalendar(); break;
    case 'icon-pick': state.icons[b.dataset.type] = b.dataset.val; save(); renderSettings(); renderCalendar(); renderDay(); break;
    case 'study': state.studyDays = Math.min(30, Math.max(1, state.studyDays + Number(b.dataset.val))); save(); renderSettings(); renderTodos(); renderDay(); break;
    case 'reset':
      if(!resetArmed){ resetArmed = true; renderSettings(); break; }
      resetArmed = false; state = Object.assign(emptyState(), {skin:state.skin}); save(); sel = todayIso(); renderAll(); toast('Se borraron todos los datos.'); break;
    case 'demo': {
      const d = seed();
      state.events.push(...d.events);
      Object.keys(d.todos).forEach(k => { state.todos[k] = [...(state.todos[k]||[]), ...d.todos[k]]; });
      d.customTypes.forEach(c => { if(!state.customTypes.some(x => x.id === c.id)){ state.customTypes.push(c); state.icons[c.id] = d.icons[c.id]; } });
      save(); renderAll(); toast('Datos de ejemplo cargados.'); break;
    }
    case 'backup': backup(); break;
    case 'restore': $('restoreFile').click(); break;
    case 'ftype': readForm(); form.type = b.dataset.val; if(form.type === 'viaje' && !form.endDate) form.endDate = form.date; drawSheet(); break;
    case 'tpick': readForm(); form.pick = b.dataset.val && form.pick !== b.dataset.val ? b.dataset.val : null; drawSheet(); break;
    case 'th': setPickTime({h:Number(b.dataset.val)}); break;
    case 'tm': setPickTime({m:Number(b.dataset.val)}); break;
    case 'tap': setPickTime({pm:b.dataset.val === 'pm'}); break;
    case 'fallday': readForm(); form.allDay = !form.allDay; if(!form.allDay && !form.start){ form.start = '09:00'; form.end = '10:00'; } drawSheet(); break;
    case 'fsave': saveForm(); break;
    case 'fdelete': {
      const ev = state.events.find(x => x.id === form.id); closeAll();
      if(ev){ state.events = state.events.filter(x => x.id !== ev.id); save(); renderAll(); toast(`${TYPES[ev.type].label} eliminado.`, () => { state.events.push(ev); save(); renderAll(); }); }
      break;
    }
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeAll();
  if(e.key === 'Enter' && e.target.id === 'todoInput') addTodo();
  if(e.key === 'Enter' && e.target.closest('.sheet') && e.target.tagName === 'INPUT') saveForm();
  if((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('ev')){ e.preventDefault(); e.target.click(); }
});
async function backup(){
  const name = `mi-agenda-${todayIso()}.json`;
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  try{
    const file = new File([blob], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Copia de Mi agenda'}); return; }
  }catch(err){ if(err && err.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Copia descargada.');
}
document.addEventListener('change', e => {
  if(e.target.id !== 'restoreFile' || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const o = JSON.parse(r.result);
      if(!o || !Array.isArray(o.events)) throw new Error('formato');
      const s = emptyState();
      state = Object.assign(s, o, {icons:Object.assign(s.icons, o.icons||{}), colors:Object.assign(s.colors, o.colors||{})});
      save(); sel = todayIso(); renderAll(); toast('Copia cargada.');
    }catch(err){ toast('Ese archivo no es una copia de Mi agenda.'); }
    e.target.value = '';
  };
  r.readAsText(e.target.files[0]);
});
document.addEventListener('input', e => {
  if(e.target.id === 'urgentInput'){ state.urgentWords = e.target.value; save(); }
  if(e.target.id === 'todoInput') syncAddFlag();
  if(e.target.dataset && e.target.dataset.ctype){ const c = state.customTypes.find(x => x.id === e.target.dataset.ctype); if(c){ c.label = e.target.value; save(); } }
  if(e.target.dataset && e.target.dataset.magic){ const r = state.magic.find(x => x.id === e.target.dataset.magic); if(r){ r.words = e.target.value; save(); renderTodos(); } }
});
/* deslizar para cambiar de mes */
(() => {
  let x0 = null, y0 = null;
  const cb = $('calBlock');
  cb.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  cb.addEventListener('touchend', e => {
    if(x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.5) goMonth(dx < 0 ? 1 : -1);
    x0 = null;
  });
})();
