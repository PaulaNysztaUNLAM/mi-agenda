<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mi agenda</title>
<meta name="theme-color" content="#AFC4DA">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi agenda">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Caveat:wght@600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#dfe4ea; --page-ink:#39424d; --app-bg:#AFC4DA;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#14171b; --page-ink:#c9ced5; color-scheme:dark; }
}
:root[data-theme="dark"]{ --page:#14171b; --page-ink:#c9ced5; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--page)}
body{margin:0;height:100%;background:var(--page);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
svg{display:block;flex-shrink:0}

/* ---------- Pieles ---------- */
[data-skin="celeste"]{--bg:#AFC4DA;--surface:#F2F5F9;--surface-2:#DCE5EF;--ink:#1D3352;--ink-soft:#5F7795;--ink-faint:#A9B8CA;--accent:#1D3352;--accent-ink:#F2F5F9;--soft:#8EA9C6;--soft-ink:#F6F9FC;--line:#CBD6E3}
[data-skin="rosa"]{--bg:#F7E1E7;--surface:#FFF8FA;--surface-2:#FBEAEF;--ink:#7E3F55;--ink-soft:#AC7487;--ink-faint:#E1C2CC;--accent:#B76A83;--accent-ink:#FFFFFF;--soft:#E8B9C7;--soft-ink:#FFFFFF;--line:#F1D6DE}
[data-skin="crema"]{--bg:#D9C9B2;--surface:#F6F0E6;--surface-2:#EADFCD;--ink:#47382B;--ink-soft:#86715D;--ink-faint:#C5B49D;--accent:#5A4636;--accent-ink:#F6F0E6;--soft:#7B7E61;--soft-ink:#F4F0E4;--line:#DFD2BE}
[data-skin]{--urgent:#D9434A;--urgent-ink:#FFFFFF}

/* ---------- Escenario y marco ---------- */
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px;gap:14px}
.phone{position:relative;width:390px;height:844px;border-radius:54px;border:11px solid #17191c;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);overflow:hidden;background:#17191c}
.caption{color:var(--page-ink);font-size:13px;margin:0;text-align:center;max-width:390px;line-height:1.5}
@media (max-width:520px){
  html,body{background:var(--app-bg)}
  .stage{padding:0;min-height:0;height:100%}
  .phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
  .caption,.statusbar{display:none !important}
}

/* ---------- App ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);transition:background .3s}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 30px 0;font-weight:800;font-size:15px;height:44px}
.statusbar .notch{width:110px;height:30px;border-radius:20px;background:#17191c;position:absolute;left:50%;top:9px;transform:translateX(-50%)}
.statusbar .sig{display:flex;gap:5px;align-items:center}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;gap:10px}
.topbar h1{font-size:17px;font-weight:800;margin:0;flex:1;text-align:center}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center}
.todaybtn{height:42px;padding:0 16px;border-radius:21px;border:0;background:var(--surface);font-weight:800;font-size:14px}
.todaybtn[hidden]{display:block;visibility:hidden}
.scroll{flex:1;overflow-y:auto;padding:4px 14px 36px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll[hidden]{display:none}
.block{background:var(--surface);border-radius:32px;padding:16px;position:relative}

/* Calendario */
.cal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.monthpill{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:20px;padding:8px 14px;font-weight:800;font-size:15px}
.chevs{display:flex;gap:6px}
.chev{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);justify-items:center}
.wk{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:8px}
.grid{row-gap:14px}
.day{position:relative;width:clamp(36px,10.4vw,44px);height:clamp(36px,10.4vw,44px);border-radius:50%;border:0;background:var(--surface-2);color:var(--ink);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.day.out{background:transparent;color:var(--ink-faint);font-weight:700}
.day.today{box-shadow:inset 0 0 0 2px var(--ink);background:var(--surface)}
.day.sel{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.badges{position:absolute;top:-7px;right:-8px;display:flex;pointer-events:none}
.badges.multi{right:auto;left:50%;transform:translateX(-50%);top:-11px}
.badge{width:21px;height:21px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.badges.multi .badge{width:18px;height:18px;margin-left:-3px;box-shadow:0 0 0 1.5px var(--surface)}
.badges.multi .badge:first-child{margin-left:0}
.day.out .badges{opacity:.55}
.badges.more::after{content:"";position:absolute;top:-1px;right:-3px;width:6px;height:6px;border-radius:50%;background:var(--accent);border:1.5px solid var(--surface)}
.day.tinted.out,.day.urgent.out{opacity:.5}
.day.tinted.sel{box-shadow:0 0 0 2.5px var(--surface),0 0 0 4.5px var(--accent)}
.day.tinted.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.tinted.today.sel{box-shadow:inset 0 0 0 2px var(--ink),0 0 0 2.5px var(--surface),0 0 0 4.5px var(--accent)}
.typerow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.typerow .ic{width:46px;height:46px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;flex-shrink:0;color:var(--ink)}
.typerow .ic[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.typerow .lbl{flex:1;font-weight:800}
.typerow input{flex:1;min-width:0}
.typerow .x{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink-soft);display:grid;place-items:center;flex-shrink:0}
.cdot{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex-shrink:0;color:var(--ink-faint);padding:0}
.cdot[aria-expanded="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:6px 2px 14px;justify-items:center}
.cgrid button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;padding:0;color:var(--ink-faint);background:var(--surface)}
.cgrid button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}

/* Urgentes y emojis */
.day.urgent{background:var(--urgent);color:var(--urgent-ink)}
.day.urgent.today{box-shadow:inset 0 0 0 2px var(--urgent-ink),0 0 0 2px var(--urgent)}
.day.urgent.sel{background:var(--urgent);color:var(--urgent-ink);box-shadow:0 0 0 2.5px var(--surface),0 0 0 4.5px var(--accent)}
.day.urgent.today.sel{box-shadow:inset 0 0 0 2px var(--urgent-ink),0 0 0 2.5px var(--surface),0 0 0 4.5px var(--accent)}
.todo .emo{display:inline-flex;vertical-align:-3px;margin-right:7px;color:var(--ink)}
.todo.done .emo{color:var(--ink-soft)}
.todo.urgent .txt{color:var(--urgent)}
.todo.urgent.done .txt{color:var(--ink-soft)}
.flag{border:0;background:transparent;color:var(--ink-faint);width:30px;height:30px;display:grid;place-items:center;border-radius:50%;padding:0}
.flag.on{color:var(--urgent)}
.addrow .addflag{background:var(--surface-2);color:var(--ink-soft)}
.addrow .addrep{background:var(--surface-2);color:var(--ink-soft)}
.addrow .addrep.on{background:var(--accent);color:var(--accent-ink)}
#addReps .reps{margin:8px 0 0}
.todo .rep{display:inline-flex;vertical-align:-2px;margin-left:6px;color:var(--ink-soft)}
.tconfirm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 4px 12px 40px;font-size:13px;font-weight:700;color:var(--ink-soft)}
.tconfirm button{height:34px;padding:0 12px;border-radius:17px;border:0;background:var(--surface-2);color:var(--ink);font-weight:800;font-size:13px}
.tconfirm button.danger{color:var(--urgent)}
.addrow .addflag.on{background:var(--urgent);color:var(--urgent-ink)}
.addhint{font-size:12px;color:var(--ink-soft);margin:8px 6px 0;line-height:1.45}
.magic{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.magic .ic{width:46px;height:46px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;flex-shrink:0;color:var(--ink)}
.magic .ic[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.magic input{flex:1;min-width:0}
.magic .x{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink-soft);display:grid;place-items:center;flex-shrink:0}
.addmagic{width:100%;height:46px;border-radius:23px;border:1.5px dashed var(--ink-faint);background:transparent;font-weight:800;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}

/* Día */
.block.events{padding-bottom:78px}
.dayhead{display:flex;align-items:center;gap:14px;border-left:3px solid var(--ink);padding-left:12px;margin:4px 0 14px}
.dayhead .num{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:800;font-size:60px;line-height:.85;letter-spacing:-.5px}
.dayhead .wd{font-weight:800;font-size:16px;text-transform:capitalize}
.dayhead .count{font-size:13px;color:var(--ink-soft);margin-top:2px}
.evlist{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:20px;padding:10px 10px 10px 10px;border:0;width:100%;text-align:left}
.ev .ic{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex-shrink:0}
.ev .body{flex:1;min-width:0}
.ev .time{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-weight:700}
.ev .name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .del{width:36px;height:36px;border-radius:13px;border:1.5px solid var(--ink-soft);background:transparent;display:grid;place-items:center;flex-shrink:0;color:var(--ink-soft)}
.empty{color:var(--ink-soft);font-size:14px;line-height:1.5;padding:6px 2px}
.fab{position:absolute;right:16px;bottom:16px;width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 18px -8px var(--accent)}

/* Pendientes */
.todohead{display:flex;justify-content:space-between;align-items:baseline;margin:2px 4px 6px}
.todohead h2{font-size:17px;margin:0;font-weight:800}
.todohead span{font-size:13px;color:var(--ink-soft);font-weight:700}
.todo{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1.5px dashed var(--line)}
.todo:last-child{border-bottom:0}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink-soft);background:transparent;display:grid;place-items:center;flex-shrink:0;padding:0;color:var(--accent-ink)}
.todo.done .chk{background:var(--accent);border-color:var(--accent)}
.todo .txt{flex:1;font-size:15px;font-weight:700;line-height:1.35}
.todo.done .txt{text-decoration:line-through;color:var(--ink-soft);font-weight:500}
.todo .auto{display:inline-flex;vertical-align:-3px;margin-right:6px;color:var(--ink-soft)}
.todo .x{border:0;background:transparent;color:var(--ink-faint);width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0}
.addrow button{width:42px;height:46px;flex-shrink:0;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center}

input[type=text],input[type=date],input[type=time],input[type=email],input[type=password]{width:100%;border:0;background:var(--surface-2);color:var(--ink);border-radius:16px;padding:13px 14px;font:inherit;font-weight:700;font-size:16px;min-height:46px;color-scheme:light;-webkit-appearance:none;appearance:none}
input[type=date]{display:flex;align-items:center}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input::placeholder{color:var(--ink-soft);font-weight:500;opacity:.8}

/* Cajón lateral */
.overlay{position:absolute;inset:0;background:rgba(10,12,16,.38);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.overlay.on{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;bottom:0;left:0;width:78%;max-width:300px;background:var(--surface);border-radius:0 34px 34px 0;transform:translateX(-102%);transition:transform .28s cubic-bezier(.3,.7,.2,1);z-index:21;padding:70px 16px 24px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.drawer.on{transform:none}
.drawer .brand{font-family:"Caveat",cursive;font-size:36px;padding:0 12px 18px}
.navitem{display:flex;align-items:center;gap:14px;border:0;background:transparent;padding:14px 14px;border-radius:20px;font-weight:800;font-size:16px;text-align:left}
.navitem.on{background:var(--surface-2)}
.riddle{margin-top:14px;background:var(--surface-2);border-radius:24px;padding:16px}
.riddle .rtitle{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--ink-soft);margin-bottom:8px}
.riddle .rq{font-size:16px;font-weight:700;line-height:1.45;margin:0 0 12px}
.riddle .rrow{display:flex;gap:6px}
.riddle input{flex:1;min-width:0;background:var(--surface)}
.riddle .rgo{height:46px;padding:0 14px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800}
.riddle .rmsg{font-size:14px;font-weight:700;margin:10px 2px 0;line-height:1.4}
.riddle .rmsg.bad{color:var(--urgent)}
.riddle .rgive{border:0;background:transparent;color:var(--ink-soft);font-weight:700;font-size:13px;text-decoration:underline;padding:8px 2px 0}
.riddle .rok{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:12px 14px;font-weight:800;line-height:1.4;animation:pop .35s ease}
.riddle .rrev{background:var(--surface);border-radius:16px;padding:12px 14px;font-weight:700;line-height:1.4}
.riddle .rstreak{font-size:12px;color:var(--ink-soft);font-weight:700;margin:10px 2px 0}
@keyframes pop{0%{transform:scale(.9);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.riddle .shake{animation:shake .25s ease 2}

/* Hoja inferior */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:34px 34px 0 0;transform:translateY(102%);transition:transform .3s cubic-bezier(.3,.7,.2,1);z-index:22;max-height:90%;overflow-y:auto;padding:10px 18px 26px}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:20px;font-weight:800}
.types{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:2px 18px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.types::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;padding:0 14px;height:40px;border-radius:20px;border:0;background:var(--surface-2);font-weight:800;font-size:13px;white-space:nowrap;flex-shrink:0;scroll-snap-align:start}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;font-weight:800;color:var(--ink-soft);margin:0 0 6px 4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-weight:800;border:0;width:100%}
.sw-track{width:44px;height:26px;border-radius:13px;background:var(--ink-faint);position:relative;transition:background .2s}
.sw-track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-checked="true"] .sw-track{background:var(--accent)}
.toggle[aria-checked="true"] .sw-track::after{transform:translateX(18px)}
.hint{font-size:13px;color:var(--ink-soft);background:var(--surface-2);border-radius:16px;padding:10px 14px;margin:0 0 12px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.timebtn{width:100%;min-height:46px;border:0;background:var(--surface-2);color:var(--ink);border-radius:16px;padding:12px 14px;font-weight:800;font-size:15px;text-align:left;font-variant-numeric:tabular-nums}
.timebtn.on{box-shadow:inset 0 0 0 2px var(--accent)}
.tpanel{background:var(--surface-2);border-radius:20px;padding:12px;margin:0 0 12px}
.tlabel{font-size:12px;font-weight:800;color:var(--ink-soft);margin:2px 2px 6px}
.tgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tgrid button,.ampm button{height:42px;border-radius:12px;border:0;background:var(--surface);color:var(--ink);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.tgrid button.on,.ampm button.on{background:var(--accent);color:var(--accent-ink)}
.ampm{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 12px}
.tpanel .done{width:100%;height:42px;border-radius:21px;border:0;background:var(--surface);font-weight:800;margin-top:12px;color:var(--ink)}
.reps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.reps button{height:42px;border-radius:14px;border:0;background:var(--surface-2);color:var(--ink);font-weight:800;font-size:13px}
.reps button.on{background:var(--accent);color:var(--accent-ink)}
.ev .rep{display:inline-flex;vertical-align:-2px;margin-left:5px}
.delrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.delrow button{height:44px;border-radius:22px;border:1.5px solid var(--ink-soft);background:transparent;color:var(--ink-soft);font-weight:800;font-size:14px}
.err{color:#b3261e;font-size:13px;font-weight:800;margin:-4px 4px 10px;min-height:0}
.actions{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;height:52px;border-radius:26px;border:0;font-weight:800;font-size:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2)}
.btn.danger{background:transparent;border:1.5px solid var(--ink-soft);color:var(--ink-soft);flex:0 0 auto;padding:0 18px}

/* Configuración */
.set h2{font-size:17px;margin:0 0 4px;font-weight:800}
.set p.sub{margin:0 0 14px;font-size:13px;color:var(--ink-soft);line-height:1.45}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.swatch{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--ink)}
.swatch .pv{width:100%;aspect-ratio:3/4;border-radius:22px;background:var(--bg);padding:10px 8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 0 0 2px transparent;transition:box-shadow .2s}
.swatch.on .pv{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.pv .c{background:var(--surface);border-radius:12px;padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;justify-items:center}
.pv .c i{width:12px;height:12px;border-radius:50%;background:var(--surface-2)}
.pv .c i.a{background:var(--accent)}
.pv .s{height:14px;border-radius:7px;background:var(--soft)}
.pv .b{flex:1;border-radius:12px;background:var(--surface)}
.icrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--surface-2);border-radius:20px;padding:10px 14px 10px 10px;margin-bottom:8px;text-align:left}
.icrow .ic{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.icrow .lbl{flex:1;font-weight:800}
.icrow .cur{font-size:13px;color:var(--ink-soft);font-weight:700}
.icgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:6px 2px 14px}
.icopt{aspect-ratio:1;border-radius:16px;border:0;background:var(--surface-2);display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--ink-soft)}
.icopt.on{background:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:46px;height:46px;border-radius:50%;border:0;background:var(--surface-2);font-size:22px;font-weight:800}
.stepper output{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-size:44px;font-weight:800;min-width:56px;text-align:center;line-height:1}
.stepper small{color:var(--ink-soft);font-weight:700;font-size:14px}

.toast{position:absolute;left:16px;right:16px;bottom:22px;background:var(--ink);color:var(--surface);border-radius:20px;padding:13px 16px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;transform:translateY(140%);opacity:0;transition:transform .25s,opacity .25s;z-index:30}
.toast.on{transform:none;opacity:1}
.toast button{border:0;background:transparent;color:var(--surface);font-weight:800;text-decoration:underline;padding:4px}

:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.day.sel:focus-visible{outline-color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

/* ===== Computadora (1024px o más). El celular no cambia. ===== */
.deskonly,.wkblock,#week{display:none}
.desk,.desk body{background:var(--app-bg)}
.desk .stage{padding:0;min-height:0;height:100%;display:block}
.desk .phone{width:100%;height:100vh;border:0;border-radius:0;box-shadow:none}
.desk .caption,.desk .statusbar,.desk [data-act="menu"],.desk #riddle{display:none !important}
.desk .app{display:grid;grid-template-columns:288px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.desk .drawer{position:relative;grid-column:1;grid-row:1 / span 2;transform:none;width:auto;max-width:none;border-radius:0;background:transparent;padding:20px 4px 24px 20px;z-index:1;transition:none;gap:4px}
.desk .drawer .brand{padding:0 12px 10px}
.desk .navitem{padding:11px 14px;font-size:15px}
.desk .navitem.on{background:var(--surface)}
.desk .overlay{z-index:20}
.desk .topbar{grid-column:2;grid-row:1;padding:20px 24px 10px;gap:8px}
.desk .topbar h1{text-align:left;font-size:22px}
.desk .deskonly{display:grid}
.desk .calonly[hidden]{display:none}
.desk .wkblock{display:block}
.desk .scroll{grid-column:2;grid-row:2;padding:4px 24px 24px}
.desk #view-cal > .block{display:none}
.desk #view-set{max-width:760px;width:100%;margin:0 auto;box-sizing:border-box}
.desk #calBlock{display:block;margin-top:12px;padding:14px}
.desk #calBlock .cal-top{margin-bottom:8px}
.desk #calBlock .monthpill{font-size:13px;padding:6px 12px}
.desk #calBlock .chev{width:30px;height:30px}
.desk #calBlock .wk{font-size:11px}
.desk #calBlock .grid{row-gap:8px}
.desk #calBlock .day{width:30px;height:30px;font-size:12px}
.desk #calBlock .badges{transform:scale(.8);transform-origin:top right}
.desk #calBlock .badges.multi{transform:translateX(-50%) scale(.8);transform-origin:top center}
.desk #calBlock .day.inweek:not(.sel):not(.tinted):not(.urgent){background:var(--line)}
.topadd{height:42px;padding:0 16px 0 12px;border-radius:21px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14px;align-items:center;gap:6px;grid-auto-flow:column}
.wkblock{background:var(--surface);border-radius:28px;padding:14px;margin-top:12px}
.wkblock h2{font-size:14px;font-weight:800;margin:2px 4px 6px}
.desk #week{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));gap:10px;min-height:calc(100% - 4px);align-items:stretch}
.wcol{background:var(--surface);border-radius:22px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.wcol.today{box-shadow:0 0 0 2.5px var(--ink)}
.whead{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;padding:10px 12px;background:var(--surface-2);color:var(--ink)}
.whead .wn{font-weight:800;font-size:13px;text-transform:capitalize}
.whead .wm{font-size:11px;font-weight:700;opacity:.8}
.whead .wnum{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:800;font-size:32px;line-height:.85}
.wsec{padding:8px 8px 4px;display:flex;flex-direction:column;gap:5px}
.wlbl{font-size:11px;font-weight:800;color:var(--ink-soft);margin:0 4px 1px}
.wev{display:flex;gap:6px;align-items:flex-start;width:100%;border:0;border-radius:12px;padding:6px 8px;background:var(--surface-2);text-align:left;color:var(--ink)}
.wev svg{margin-top:1px}
.wev .t{display:block;font-size:10.5px;font-weight:800;opacity:.8;font-variant-numeric:tabular-nums}
.wev .n{display:block;font-weight:800;font-size:12px;line-height:1.25;overflow-wrap:anywhere}
.wempty{font-size:12px;color:var(--ink-soft);font-weight:700;margin:2px 4px}
.wadd{border:0;background:transparent;color:var(--ink-soft);font-weight:800;font-size:12px;display:flex;align-items:center;gap:4px;padding:4px;align-self:flex-start;border-radius:8px}
.wadd:hover{color:var(--ink)}
.wtodos{padding:4px 8px 10px;display:flex;flex-direction:column;flex:1;border-top:1.5px dashed var(--line);margin-top:6px}
.wtodo{display:flex;gap:6px;align-items:flex-start;padding:4px 2px;position:relative}
.wtodo .chk{width:16px;height:16px;border-width:1.5px;margin-top:1px}
.wtodo .txt{flex:1;font-size:12px;font-weight:700;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.wtodo .emo{display:inline-flex;vertical-align:-2px;margin-right:4px;color:var(--ink)}
.wtodo .rep{display:inline-flex;vertical-align:-2px;margin-left:4px;color:var(--ink-soft)}
.wtodo.done .txt{text-decoration:line-through;color:var(--ink-soft);font-weight:500}
.wtodo.urgent .txt{color:var(--urgent)}
.wtodo.urgent.done .txt{color:var(--ink-soft)}
.wtodo .acts{position:absolute;right:0;top:1px;display:flex;background:var(--surface);border-radius:8px;box-shadow:-6px 0 6px var(--surface);opacity:0;pointer-events:none;transition:opacity .15s}
.wtodo:hover .acts,.wtodo:focus-within .acts{opacity:1;pointer-events:auto}
.wtodo .acts button{width:22px;height:22px;border:0;background:transparent;color:var(--ink-faint);display:grid;place-items:center;padding:0;border-radius:6px}
.wtodo .acts button.on{color:var(--urgent)}
.wtodo .acts button:hover{color:var(--ink)}
.wtodos .tconfirm{padding:0 0 6px 22px;font-size:11px}
.wtodos .tconfirm button{height:26px;padding:0 8px;font-size:11px}
#week input.winput,.wkblock input.winput{width:100%;box-sizing:border-box;border:0;background:var(--surface-2);border-radius:10px;padding:7px 9px;font:inherit;font-size:12px;font-weight:700;color:var(--ink);min-height:0;margin-top:auto}
.desk .sheet{left:50%;right:auto;bottom:auto;top:50%;width:520px;max-height:88vh;border-radius:28px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s}
.desk .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.desk .sheet .grab{display:none}
.wev .st{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:800;color:var(--ink-soft);margin-top:2px}
.wev .st i{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sheet .reps.status button{font-size:12px}
.desk .swatches{grid-template-columns:repeat(3,150px)}
.desk .toast{left:auto;right:24px;width:360px}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="app" id="app" data-skin="celeste">
      <div class="statusbar"><span id="clock">9:41</span><span class="notch"></span><span class="sig">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="2.5" y="2.5" width="16" height="8" rx="2" fill="currentColor"/><rect x="24" y="4.5" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".5"/></svg>
      </span></div>

      <header class="topbar">
        <button class="iconbtn" data-act="menu" aria-label="Abrir menú"></button>
        <h1 id="title">Calendario</h1>
        <button class="iconbtn deskonly calonly" data-act="wprev" aria-label="Semana anterior" id="wPrev"></button>
        <button class="iconbtn deskonly calonly" data-act="wnext" aria-label="Semana siguiente" id="wNext"></button>
        <button class="todaybtn" data-act="today" id="todayBtn">Hoy</button>
        <button class="topadd deskonly calonly" data-act="add" id="topAdd"></button>
      </header>

      <main class="scroll" id="view-cal">
        <div id="week" aria-label="Semana"></div>
        <section class="block" id="calBlock">
          <div class="cal-top">
            <div class="monthpill"><span id="pillIcon"></span><span id="monthLabel"></span></div>
            <div class="chevs">
              <button class="chev" data-act="prev" aria-label="Mes anterior"></button>
              <button class="chev" data-act="next" aria-label="Mes siguiente"></button>
            </div>
          </div>
          <div class="wk"><span>Lu</span><span>Ma</span><span>Mi</span><span>Ju</span><span>Vi</span><span>Sá</span><span>Do</span></div>
          <div class="grid" id="grid"></div>
        </section>

        <section class="block events">
          <div class="dayhead" id="dayhead"></div>
          <div class="evlist" id="evlist"></div>
          <button class="fab" data-act="add" aria-label="Agregar evento a este día"></button>
        </section>

        <section class="block">
          <div class="todohead"><h2>Pendientes</h2><span id="todoCount"></span></div>
          <div id="todolist"></div>
          <div class="addrow">
            <input type="text" id="todoInput" placeholder="Nueva tarea" maxlength="80">
            <button class="addflag" data-act="add-flag" id="addFlag" aria-pressed="false" aria-label="Marcar como urgente"></button>
            <button class="addrep" data-act="add-rep" id="addRep" aria-expanded="false" aria-label="Repetir tarea"></button>
            <button data-act="todo-add" aria-label="Agregar tarea"></button>
          </div>
          <div id="addReps"></div>
          <p class="addhint" id="addHint"></p>
        </section>
      </main>

      <main class="scroll" id="view-set" hidden></main>

      <div class="overlay" id="overlay" data-act="close-all"></div>
      <nav class="drawer" id="drawer" aria-label="Menú principal">
        <div class="brand">Mi agenda</div>
        <button class="navitem" data-act="nav" data-route="cal"></button>
        <button class="navitem" data-act="nav" data-route="set"></button>
        <section class="riddle" id="riddle" aria-live="polite"></section>
        <section class="wkblock" id="wkBlock" aria-label="Pendientes de la semana"></section>
      </nav>

      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
      <div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" data-act="undo" hidden>Deshacer</button></div>
    </div>
  </div>
  <p class="caption">Abrí esta página desde el celular y agregala a la pantalla de inicio para usarla como app. Los datos quedan guardados en el dispositivo.</p>
</div>

  return {label, field:'Título', ph:'Ej: Título del evento'};

const typeOrder = () => ['examen','tp','viaje','evento', ...customIds()];   // mismo orden que en Configuración

const COLOR_NAMES = {'#C9B6E4':'Lila','#A8DCC6':'Menta','#F7C59F':'Durazno','#F5DD8C':'Amarillo','#9CC8EC':'Celeste','#F4AFC6':'Rosa','#B5C99A':'Salvia','#7E6BB0':'Violeta','#3F6FB5':'Azul','#3E8E6A':'Verde','#E07B39':'Naranja','#9AA3AD':'Gris'};
function inkFor(hex){
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.6 ? '#2A2630' : '#FFFFFF';
}

/* ---------- Fechas ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const todayIso = () => iso(new Date());
const fmtMonth = new Intl.DateTimeFormat('es-AR',{month:'long'});
const fmtWd = new Intl.DateTimeFormat('es-AR',{weekday:'long'});
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const shortDate = s => { const d = parse(s); return `${d.getDate()}/${d.getMonth()+1}`; };
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Estado ---------- */

}
function emptyState(){ const s = seed(); s.events = []; s.todos = {}; s.autoDone = {}; return s; }
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const o = JSON.parse(raw); const s = seed(); return Object.assign(s, o, {icons:Object.assign(s.icons, o.icons||{}), colors:Object.assign(s.colors, o.colors||{})}); }
  }catch(e){}
  return emptyState();
}

let state = load();
let sel = todayIso();
let view = {y:new Date().getFullYear(), m:new Date().getMonth()};
let route = 'cal';

let openColor = null;     // tipo cuyo selector de color está abierto

let addRepeat = '', showAddRep = false, confirmTodoDel = null;
let undoFn = null, toastT = null, resetArmed = false;

const $ = id => document.getElementById(id);

/* ---------- Datos derivados ---------- */
/* ¿El evento (o su repetición) empieza el día o? */
function startsOn(e, o){
  if(o < e.date) return false;
  if(e.until && o > e.until) return false;
  if(e.skip && e.skip.includes(o)) return false;
  if(!e.repeat || o === e.date) return o === e.date;
  if(e.repeat === 'day') return true;
  if(e.repeat === 'week') return diffDays(e.date, o) % 7 === 0;
  if(e.repeat === 'month') return parse(o).getDate() === parse(e.date).getDate();
  return false;
}
function eventsOn(s){
  const out = [];
  state.events.forEach(e => {
    const span = e.endDate ? Math.max(0, diffDays(e.date, e.endDate)) : 0;
    for(let k = 0; k <= span; k++){
      const o = addDays(s, -k);
      if(startsOn(e, o)){ out.push({...e, _occ:o, _occEnd:addDays(o, span)}); break; }
    }
  });
  return out.sort((a,b) => (b.allDay?1:0)-(a.allDay?1:0) || startOn(a,s).localeCompare(startOn(b,s)));
}
const REPEAT_TXT = {day:'Se repite todos los días', week:'Se repite cada semana', month:'Se repite cada mes'};
function startOn(e, s){ return !e.allDay && (e._occ || e.date) < s ? '00:00' : (e.start || ''); }
function crossesMidnight(e){ return !e.allDay && e.type !== 'viaje' && e.endDate && e.endDate > e.date;
}
function autoTodos(s){
  return state.events.filter(e => e.type === 'examen')
    .map(e => ({e, n:diffDays(s, e.date)}))
    .filter(x => x.n >= 1 && x.n <= state.studyDays)
    .sort((a,b) => a.n - b.n)
    .map(x => { const key = x.e.id+'|'+s; return {key, text:`Estudiar ${x.e.title} (${x.n})`, done:!!state.autoDone[key], auto:true}; });
}
function rtodosOn(s){
  return (state.rtodos || []).filter(r => startsOn(r, s))
    .map(r => ({id:r.id, text:r.text, urgent:!!r.urgent, done:!!(r.done && r.done[s]), rep:r.repeat}));
}
function todosOn(s){ return [...autoTodos(s), ...rtodosOn(s), ...(state.todos[s]||[])]; }
/* urgente siempre gana al color del evento.
   Repetidas urgentes: semanales y mensuales se pintan en todas sus fechas;
   las diarias solo hasta hoy, para no llenar el mes de rojo. */
function urgentCount(s){
  const own = (state.todos[s]||[]).filter(t => t.urgent && !t.done).length;
  const rep = rtodosOn(s).filter(t => t.urgent && !t.done && (t.rep !== 'day' || s <= todayIso())).length;
  return own + rep;
}
function dayUrgent(s){ return urgentCount(s) > 0; }
function wordRe(w){
  const e = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp('(^|[^\\p{L}\\p{N}])' + e + '($|[^\\p{L}\\p{N}])', 'iu');
}
function markerFor(text){
  for(const r of state.magic || []){
    const words = r.words.split(',').map(w => w.trim()).filter(Boolean);
    if(words.some(w => wordRe(w).test(text))) return r.icon;
  }
  return '';
}
function isUrgentText(text){
  const t = text.toLowerCase();
  return (state.urgentWords||'').split(',').map(w => w.trim().toLowerCase()).filter(Boolean).some(w => t.includes(w));
}

/* ---------- Render ---------- */
function applySkin(){

function renderCalendar(){
  const {y,m} = view;
  $('monthLabel').textContent = `${cap(fmtMonth.format(new Date(y,m,1)))} ${y}`;
  const offset = (new Date(y,m,1).getDay()+6)%7;
  const dim = new Date(y,m+1,0).getDate();
  const cells = Math.ceil((offset+dim)/7)*7;
  const t = todayIso();
  const order = typeOrder();
  let html = '';
  for(let i=0;i<cells;i++){
    const d = new Date(y,m,1-offset+i);
    const s = iso(d);
    const out = d.getMonth() !== m;
    const evs = eventsOn(s);
    const withIcon = evs.filter(e => state.icons[e.type] && state.icons[e.type] !== 'none')
      .sort((a,b) => order.indexOf(a.type) - order.indexOf(b.type));
    const shown = withIcon.slice(0, 3), multi = shown.length > 1;
    const badge = shown.length ? `<span class="badges${multi?' multi':''}${withIcon.length>3?' more':''}">${shown.map(e => `<span class="badge">${ico(state.icons[e.type], multi?11:13, 2.2)}</span>`).join('')}</span>` : '';
    const urgent = dayUrgent(s);
    const tintType = urgent ? null : order.find(tp => state.colors && state.colors[tp] && evs.some(e => e.type === tp));
    const tint = tintType ? state.colors[tintType] : '';
    const style = tint ? ` style="background:${tint};color:${inkFor(tint)}"` : '';
    const cls = ['day', out&&'out', s===t&&'today', s===sel&&'sel', urgent&&'urgent', tint&&'tinted', isDesk() && weekStart(s)===weekStart(sel) && 'inweek'].filter(Boolean).join(' ');
    const label = `${d.getDate()} de ${fmtMonth.format(d)}${evs.length?`, ${evs.length} evento${evs.length>1?'s':''}`:''}`;
    html += `<button class="${cls}" data-act="day" data-date="${s}" aria-label="${label}"${style} ${s===sel?'aria-current="date"':''}>${d.getDate()}${badge}</button>`;
  }
  $('grid').innerHTML = html;
}


function renderDay(){
  const d = parse(sel);
  const evs = eventsOn(sel);
  const pend = todosOn(sel).filter(x => !x.done).length;
  const urg = urgentCount(sel);
  const wd = sel === todayIso() ? 'Hoy, '+fmtWd.format(d) : fmtWd.format(d);
  $('dayhead').innerHTML = `<div class="num">${pad(d.getDate())}</div><div><div class="wd">${wd}</div><div class="count">${evs.length} evento${evs.length===1?'':'s'} y ${pend} tarea${pend===1?'':'s'} pendiente${pend===1?'':'s'}</div>${urg ? `<div class="count" style="color:var(--urgent);font-weight:800">${urg} urgente${urg===1?'':'s'} sin completar</div>` : ''}</div>`;
  $('evlist').innerHTML = evs.length ? evs.map(e => {
    let time;
    if(e.allDay){
      time = e._occEnd !== e._occ ? `Todo el día, del ${shortDate(e._occ)} al ${shortDate(e._occEnd)}` : 'Todo el día';
    } else {
      if(crossesMidnight(e) && sel > e._occ) time = `Empezó ayer a las ${fmtT(e.start)}, termina ${fmtT(e.end)}`;
      else if(crossesMidnight(e)) time = `${fmtT(e.start)} – ${fmtT(e.end)} del día siguiente`;
      else time = e.end ? `${fmtT(e.start)} – ${fmtT(e.end)}` : fmtT(e.start);
    }
    const pre = e.type === 'examen' ? 'Examen: ' : e.type === 'tp' ? 'Entrega TP: ' : e.type === 'viaje' ? 'Viaje a ' : '';
    return `<div class="ev" role="button" tabindex="0" data-act="edit" data-id="${e.id}" data-occ="${e._occ}">
      <span class="ic">${ico(state.icons[e.type] === 'none' ? 'dot' : state.icons[e.type],18)}</span>
      <span class="body"><div class="time">${time}${e.repeat ? `<span class="rep" title="${REPEAT_TXT[e.repeat]}">${ico('repeat',13)}</span>` : ''}</div><div class="name">${esc(pre+e.title)}</div></span>
      <button class="del" data-act="del" data-id="${e.id}" data-occ="${e._occ}" aria-label="${e.repeat ? 'Eliminar solo este día de ' : 'Eliminar '}${esc(e.title)}">${ico('trash',17)}</button>
    </div>`;
  }).join('') : `<p class="empty">No tenés eventos este día. Tocá + para agregar uno.</p>`;
  renderWeek();
}

function renderTodos(){
  const list = todosOn(sel);
  const done = list.filter(x => x.done).length;
  $('todoCount').textContent = list.length ? `${done} de ${list.length} hechas` : '';
  $('todolist').innerHTML = list.length ? list.map(x => {
    const ref = x.auto ? `data-key="${x.key}"` : x.rep ? `data-rid="${x.id}"` : `data-id="${x.id}"`;
    const emo = markerFor(x.text, x.auto);
    const repTxt = {day:'Se repite todos los días', week:'Se repite cada semana', month:'Se repite cada mes'}[x.rep];
    return `<div class="todo${x.done?' done':''}${x.urgent?' urgent':''}">
      <button class="chk" data-act="todo-toggle" ${ref} role="checkbox" aria-checked="${x.done}" aria-label="${esc(x.text)}">${x.done?ico('check',14,3):''}</button>

  renderWeek();

/* ---------- Selector de hora: AM = 00–11, PM = 12–23 ---------- */

/* ---------- Eventos ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(b.dataset.wdate && b.dataset.wdate !== sel){ sel = b.dataset.wdate; const d = parse(sel); view = {y:d.getFullYear(), m:d.getMonth()}; renderCalendar(); }
  switch(a){
    case 'sync-in': cloud.signIn(false); break;
    case 'sync-up': cloud.signIn(true); break;
    case 'sync-now': cloud.sync(); break;
    case 'sync-out': cloud.client.auth.signOut(); cloud.user = null; cloud.msg = ''; renderSettings(); toast('Cerraste sesión. Tus datos siguen en este dispositivo.'); break;
    case 'wprev': case 'wnext': {
      sel = addDays(sel, a === 'wprev' ? -7 : 7); const d = parse(sel); view = {y:d.getFullYear(), m:d.getMonth()};
      confirmTodoDel = null; renderAll(); break;
    }
    case 'wk-toggle': case 'wk-del': {
      const ws = weekStart(sel); const list = (state.weekTodos && state.weekTodos[ws]) || [];
      const x = list.find(y => y.id === b.dataset.id); if(!x) break;
      if(a === 'wk-toggle') x.done = !x.done; else state.weekTodos[ws] = list.filter(y => y !== x);
      save(); renderWeekTodos(ws); break;
    }
    case 'menu': renderRiddle(); $('drawer').classList.add('on'); $('overlay').classList.add('on'); break;
    case 'riddle-try': tryRiddle(); break;
    case 'riddle-give': {
      const r = todayRiddleState(); r.revealed = true; save(); renderRiddle(); break;
    }
    case 'close-all': closeAll(); break;
    case 'nav': route = b.dataset.route; resetArmed = false; openIcon = null; closeAll(); renderAll(); $(route==='cal'?'view-cal':'view-set').scrollTop = 0; break;
    case 'prev': goMonth(-1); break;
    case 'next': goMonth(1); break;
    case 'today': { sel = todayIso(); const d = new Date(); view = {y:d.getFullYear(), m:d.getMonth()}; renderAll(); break; }
    case 'day': { sel = b.dataset.date; const d = parse(sel); if(d.getMonth() !== view.m){ view = {y:d.getFullYear(), m:d.getMonth()}; } renderCalendar(); renderDay(); renderTodos(); break; }
    case 'add': openSheet(null); break;

    case 'fstatus': readForm(); form.status = b.dataset.val; drawSheet(); break;
    case 'frepeat': readForm(); form.repeat = b.dataset.val; drawSheet(); break;
    case 'del': {

const norm = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zñ ]/g, ' ').replace(/\s+/g, ' ').trim();
function gcd(a, b){ return b ? gcd(b, a % b) : a; }
function todayRiddle(){
  const n = RIDDLES.length;
  const days = Math.round((parse(todayIso()) - new Date(2026, 0, 1)) / 86400000);
  const step = [7, 11, 13, 17, 19, 23].find(x => gcd(x, n) === 1);
  return RIDDLES[(((days % n) + n) % n * step + 5) % n];
}
function todayRiddleState(){
  const t = todayIso();
  if(!state.riddle || state.riddle.date !== t) state.riddle = {date:t, tries:0, solved:false, revealed:false};
  return state.riddle;
}
function isRiddleAnswer(input, r){
  const words = norm(input).split(' ').map(w => w.replace(/(es|s)$/, '')).filter(Boolean);
  return r.ok.some(ans => { const a = norm(ans).replace(/(es|s)$/, ''); return words.includes(a) || norm(input) === norm(ans); });
}
function renderRiddle(msg = '', bad = false){
  const r = todayRiddle(), st = todayRiddleState(), streak = state.riddleStreak || 0;
  let body;
  if(st.solved) body = `<div class="rok">¡Adivinaste! Era “${esc(r.a)}”. Mañana hay otro.</div>`;
  else if(st.revealed) body = `<div class="rrev">Era “${esc(r.a)}”. Mañana te toca uno nuevo.</div>`;
  else body = `<div class="rrow${bad ? ' shake' : ''}">

      <button class="rgo" data-act="riddle-try">Probar</button>

    ${msg ? `<p class="rmsg${bad ? ' bad' : ''}">${msg}</p>` : ''}
    <button class="rgive" data-act="riddle-give">Me rindo, decime qué es</button>`;
  $('riddle').innerHTML = `<div class="rtitle">${ico('star', 16)} Acertijo del día</div>
    <p class="rq">${esc(r.q)}</p>${body}
    ${streak > 1 && state.riddleLast >= addDays(todayIso(), -1) ? `<p class="rstreak">Racha: ${streak} días seguidos adivinando</p>` : ''}`;
}
function tryRiddle(){
  const i = $('riddleInput'); if(!i) return;
  const v = i.value.trim(); if(!v) return;
  const r = todayRiddle(), st = todayRiddleState();
  st.tries++;
  if(isRiddleAnswer(v, r)){
    st.solved = true;
    state.riddleStreak = state.riddleLast === addDays(todayIso(), -1) ? (state.riddleStreak || 0) + 1 : 1;
    state.riddleLast = todayIso();
    save(); renderRiddle();
  } else {
    save();
    const tips = ['No es eso. ¡Probá de nuevo!', 'Casi… pensalo un poquito más.', 'Nop. Leelo otra vez despacio.'];

}

const CFG = window.MI_AGENDA_CONFIG || {};
const SYNC_META = 'mi-agenda-sync';
function loadScript(src){ return new Promise((ok, fail) => { const x = document.createElement('script'); x.src = src; x.onload = ok; x.onerror = fail; document.head.appendChild(x); }); }
function normalizeState(o){
  const s = emptyState(); o = o || {};
  return Object.assign(s, o, {icons:Object.assign(s.icons, o.icons||{}), colors:Object.assign(s.colors, o.colors||{})});
}
function byId(a, b, preferA){
  const m = new Map();
  (preferA ? [...(b||[]), ...(a||[])] : [...(a||[]), ...(b||[])]).forEach(x => { if(x && x.id) m.set(x.id, x); });
  return [...m.values()];
}
function mergeDays(a, b, p){
  const out = {};
  new Set([...Object.keys(a||{}), ...Object.keys(b||{})]).forEach(k => { const v = byId((a||{})[k], (b||{})[k], p); if(v.length) out[k] = v; });
  return out;
}
/* Junta dos versiones sin perder nada: eventos y tareas se suman por id.
   preferLocal: si un mismo elemento está en los dos lados, gana el de este dispositivo. */
function mergeStates(local, remote, preferLocal){
  const L = normalizeState(local), R = normalizeState(remote);
  const out = preferLocal ? {...R, ...L} : {...L, ...R};
  out.icons = preferLocal ? {...R.icons, ...L.icons} : {...L.icons, ...R.icons};
  out.colors = preferLocal ? {...R.colors, ...L.colors} : {...L.colors, ...R.colors};
  ['events','rtodos','customTypes','magic'].forEach(k => out[k] = byId(L[k], R[k], preferLocal));
  out.todos = mergeDays(L.todos, R.todos, preferLocal);
  out.weekTodos = mergeDays(L.weekTodos, R.weekTodos, preferLocal);
  out.autoDone = {...(R.autoDone||{}), ...(L.autoDone||{})};
  return out;
}

  if(!cloud.user) return `<section class="block set">${head}
    <p class="sub">Entrá con tu mail y una contraseña. Usá la misma cuenta en el celular y en la compu. Lo que ya cargaste no se borra: se suma a tu cuenta.</p>
    <div style="display:flex;flex-direction:column;gap:8px">
      <label class="field" style="margin:0"><span>Mail</span><input type="email" id="syncEmail" value="${esc(cloud.email)}" autocomplete="email" autocapitalize="none" placeholder="tu@mail.com"></label>
      <label class="field" style="margin:0"><span>Contraseña</span><input type="password" id="syncPass" autocomplete="current-password" placeholder="Mínimo 6 caracteres"></label>
      ${cloud.msg ? `<p class="sub" style="margin:2px 4px;font-weight:800">${esc(cloud.msg)}</p>` : ''}
      <div class="row2" style="margin-top:4px"><button class="btn primary" data-act="sync-in">Entrar</button><button class="btn ghost" data-act="sync-up">Crear cuenta</button></div>
    </div></section>`;
  const at = cloud.meta.at ? new Date(cloud.meta.at) : null;
  const status = cloud.err ? `<span style="color:var(--urgent);font-weight:800">No se pudo sincronizar: ${esc(cloud.err)}</span>`
    : cloud.busy ? 'Sincronizando…'
    : !navigator.onLine ? 'Sin internet. Tus cambios se guardan acá y se suben cuando vuelva la conexión.'
    : cloud.meta.dirty ? 'Hay cambios esperando para subir.'
    : at ? `Todo sincronizado (${pad(at.getHours())}:${pad(at.getMinutes())}).` : 'Todavía no se sincronizó.';
  return `<section class="block set">${head}
    <p class="sub">Conectada como <b>${esc(cloud.user.email || '')}</b>.<br>${status}</p>
    <div class="row2"><button class="btn primary" data-act="sync-now">Sincronizar ahora</button><button class="btn ghost" data-act="sync-out">Cerrar sesión</button></div>
  </section>`;
}
window.addEventListener('online', () => cloud.sync());
document.addEventListener('visibilitychange', () => { if(!document.hidden) cloud.sync(); });
setInterval(() => { if(!document.hidden) cloud.sync(); }, 60000);

async function backup(){
  const name = `mi-agenda-${todayIso()}.json`;
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  try{
    const file = new File([blob], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Copia de Mi agenda'}); return; }
  }catch(err){ if(err && err.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Copia descargada.');
}
document.addEventListener('change', e => {
  if(e.target.id !== 'restoreFile' || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const o = JSON.parse(r.result);
      if(!o || !Array.isArray(o.events)) throw new Error('formato');
      const s = emptyState();
      state = Object.assign(s, o, {icons:Object.assign(s.icons, o.icons||{}), colors:Object.assign(s.colors, o.colors||{})});
      save(); sel = todayIso(); renderAll(); toast('Copia cargada.');
    }catch(err){ toast('Ese archivo no es una copia de Mi agenda.'); }
    e.target.value = '';
  };
  r.readAsText(e.target.files[0]);
});
document.addEventListener('input', e => {
  if(e.target.id === 'urgentInput'){ state.urgentWords = e.target.value; save(); }
  if(e.target.id === 'todoInput') syncAddFlag();
  if(e.target.dataset && e.target.dataset.ctype){ const c = state.customTypes.find(x => x.id === e.target.dataset.ctype); if(c){ c.label = e.target.value; save(); } }
  if(e.target.dataset && e.target.dataset.magic){ const r = state.magic.find(x => x.id === e.target.dataset.magic); if(r){ r.words = e.target.value; save(); renderTodos(); } }
});
/* deslizar para cambiar de mes */
(() => {
  let x0 = null, y0 = null;
  const cb = $('calBlock');
  cb.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  cb.addEventListener('touchend', e => {
    if(x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.5) goMonth(dx < 0 ? 1 : -1);
    x0 = null;
  });
})();
